name: dbt_project
version: "1.0.0"
config-version: 2

profile: dbt_project

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  dbt_project:
    staging:
      +schema: staging
      +materialized: view
    marts:
      dimensions:
        +schema: marts
        +materialized: table
      facts:
        +schema: marts
        +materialized: incremental
        +unique_key: scrobble_id